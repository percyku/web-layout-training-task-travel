<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined"
      rel="stylesheet"
    />
    <title>登入</title>
  </head>

  <body>
    <div class="container-fluid">
      <div class="d-flex align-items-stretch">
        <div class="flex-shrink-0 left-side d-none d-xl-block py-10 ps-10">
          <div
            id="carouselExampleIndicators"
            class="carousel slide"
            data-bs-ride="carousel"
          >
            <div class="carousel-indicators">
              <button
                type="button"
                data-bs-target="#carouselExampleIndicators"
                data-bs-slide-to="0"
                class="active d-none"
                aria-current="true"
                aria-label="Slide 1"
              ></button>
              <button
                type="button"
                data-bs-target="#carouselExampleIndicators"
                data-bs-slide-to="1"
                aria-label="Slide 2"
                class="d-none"
              ></button>
              <button
                type="button"
                data-bs-target="#carouselExampleIndicators"
                data-bs-slide-to="2"
                aria-label="Slide 3"
                class="d-none"
              ></button>
            </div>
            <div class="carousel-inner">
              <div class="carousel-item active">
                <img
                  src="/assets/images/login/cover-pic-1.png"
                  class="d-block img-size"
                  alt="..."
                />
              </div>
              <div class="carousel-item">
                <img
                  src="/assets/images/login/cover-pic-2.png"
                  class="d-block img-size"
                  alt="..."
                />
              </div>
              <div class="carousel-item">
                <img
                  src="/assets/images/login/cover-pic-3.png"
                  class="d-block img-size"
                  alt="..."
                />
              </div>
            </div>
            <!-- <button
              class="carousel-control-prev "
              type="button"
              data-bs-target="#carouselExampleIndicators"
              data-bs-slide="prev"
            >
              <span
                class="carousel-control-prev-icon"
                aria-hidden="true"
              ></span>
              <span class="visually-hidden">Previous</span>
            </button>
            <button
              class="carousel-control-next"
              type="button"
              data-bs-target="#carouselExampleIndicators"
              data-bs-slide="next"
            >
              <span
                class="carousel-control-next-icon"
                aria-hidden="true"
              ></span>
              <span class="visually-hidden">Next</span>
            </button> -->
          </div>
        </div>
        <div class="container right-side">
          <div class="row justify-content-center h-100">
            <div class="col-12 col-xl-6">
              <h3 class="fs-3 fw-bold text-neutral-100">歡迎回來！</h3>
              <form>
                <div class="py-7 py-xl-10">
                  <div class="position-relative mb-2">
                    <img
                      src="/assets/images/login/google.png"
                      alt="google"
                      class="login-img-size material-icons-outlined align-bottom position-relative position-absolute top-50 start-0 translate-middle-y ps-4 text-neutral-60"
                    />
                    <button
                      type="button"
                      class="rounded-3 py-5 text-center w-100 btn border"
                    >
                      使用 Google 帳號登入
                    </button>
                    <!-- <input
                      type="search"
                      class="form-control rounded-3 py-5 text-center"
                      id="navbar-lg-search"
                      placeholder="使用 Google 帳號登入"
                    /> -->
                  </div>
                  <div class="position-relative mb-2">
                    <img
                      src="/assets/images/login/facebook.png"
                      alt="facebook"
                      class="login-img-size material-icons-outlined align-bottom position-relative position-absolute top-50 start-0 translate-middle-y ps-4 text-neutral-60"
                    />
                    <button
                      type="button"
                      class="rounded-3 py-5 text-center w-100 btn border"
                    >
                      使用 Facebook 帳號登入
                    </button>
                    <!-- <input
                      type="search"
                      class="form-control rounded-3 py-5 text-center"
                      id="navbar-lg-search"
                      placeholder="使用 Facebook 帳號登入"
                    /> -->
                  </div>
                  <div class="position-relative mb-2">
                    <img
                      src="/assets/images/login/apple.png"
                      alt="apple"
                      class="login-img-size material-icons-outlined align-bottom position-relative position-absolute top-50 start-0 translate-middle-y ps-4 text-neutral-60"
                    />
                    <button
                      type="button"
                      class="rounded-3 py-5 text-center w-100 btn border"
                    >
                      使用 Apple 帳號登入
                    </button>
                    <!-- <input
                      type="search"
                      class="form-control rounded-3 py-5 text-center"
                      id="navbar-lg-search"
                      placeholder="使用 Apple 帳號登入"
                    /> -->
                  </div>
                </div>
                <div>
                  <p class="fw-bold text-neutral-100 mb-5">
                    或使用 ZOBAA 帳號登入
                  </p>
                  <div class="mb-5">
                    <label for="exampleFormControlInput1" class="form-label"
                      >電子信箱 <span style="color: red">*</span></label
                    >
                    <input
                      type="email"
                      class="form-control py-5"
                      id="exampleFormControlInput1"
                      placeholder="請輸入電子信箱"
                    />
                  </div>
                  <div class="mb-5">
                    <label for="exampleFormControlInput2" class="form-label"
                      >密碼 <span style="color: red">*</span></label
                    >
                    <input
                      type="password"
                      class="form-control py-5"
                      id="exampleFormControlInput2"
                      placeholder="請輸入密碼"
                    />
                  </div>

                  <div
                    class="d-flex flex-nowrap justify-content-between mb-7 mb-xl-10"
                  >
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        value=""
                        id="flexCheckDefault"
                      />
                      <label class="form-check-label" for="flexCheckDefault">
                        記住帳號
                      </label>
                    </div>
                    <a href="#" class="text-neutral-80">忘記密碼?</a>
                  </div>

                  <button
                    class="btn btn-primary rounded-3 py-5 px-9 border-0 w-100 mb-6 mb-xl-10"
                    type="button"
                  >
                    立即登入
                  </button>
                  <p class="text-neutral-80 me-2">
                    沒有 ZOBAA 帳號嗎？
                    <u class="text-primary fw-bold">立即註冊</u>
                  </p>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="../main.js"></script>
  </body>
</html>
